name: Build Aether Android VPN (ARM64)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build & Verify ARM64 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "26.3.11579264"
      GRADLE_VERSION: "8.9"
      HEV_VERSION: "2.20.0"
      SINGBOX_VERSION: "v1.12.25"
      BUILD_JOBS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute unique debug build version
        run: |
          DEBUG_VER="1.1.0-debug-b${GITHUB_RUN_NUMBER}"
          echo "DEBUG_VERSION=${DEBUG_VER}" >> "$GITHUB_ENV"
          echo "Computed Debug Version: ${DEBUG_VER}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Set up pinned Gradle 8.9 with build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      - name: Fail-fast Kotlin compilation and unit tests
        run: gradle --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Generate Cargo lockfile for JNI crate
        run: cargo generate-lockfile --manifest-path native/aether-jni/Cargo.toml

      - name: Cache Rust & Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/aether-jni -> target"
          cache-all-targets: "true"
          key: "cargo-ndk-${{ env.ANDROID_NDK_VERSION }}"

      - name: Cache pinned hev-socks5-tunnel source & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            native/hev-socks5-tunnel
            native/hev-socks5-tunnel/libs
            native/hev-socks5-tunnel/obj
          key: hev-socks5-tunnel-${{ env.HEV_VERSION }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Set up Go (for Psiphon compilation)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            native/psiphon-tunnel-core
          key: ${{ runner.os }}-go-1.26.3-psiphon-cluvex-83aa73b-v1
          restore-keys: |
            ${{ runner.os }}-go-1.26.3-psiphon-cluvex-83aa73b-

      - name: Build ARM64 Psiphon tunnel core (Go layer)
        run: bash scripts/build-psiphon.sh

      - name: Cache compiled ARM64 libsing-box.so
        id: cache-singbox
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsing-box.so
          key: sing-box-${{ env.SINGBOX_VERSION }}-go-1.26.3-arm64-v4

      - name: Build ARM64 sing-box core (Go layer)
        if: steps.cache-singbox.outputs.cache-hit != 'true'
        env:
          SINGBOX_VERSION: "${{ env.SINGBOX_VERSION }}"
        run: bash scripts/build-singbox.sh

      - name: Fail-fast smoke test Psiphon TLS initialization
        run: |
          echo "[*] Running host-native ConsoleClient -version smoke test to verify psiphon-tls init..."
          (
            cd native/psiphon-tunnel-core
            CGO_ENABLED=0 go run -mod=vendor -ldflags="-s -w -checklinkname=0" ./ConsoleClient -version
          )
          echo "[+] Verified: psiphon-tls init.0 executed successfully without panic."

      - name: Build ARM64 native libraries (Aether + pinned HEV 2.20.0)
        env:
          ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
        run: bash scripts/build-natives.sh

      - name: Verify ARM64 shared libraries exist and are ELF aarch64
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libaether_jni.so
          test -s app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          test -s app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          test -s app/src/main/jniLibs/arm64-v8a/libpsiphon-tunnel-core.so
          test -s app/src/main/jniLibs/arm64-v8a/libsing-box.so
          file app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libc++_shared.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libpsiphon-tunnel-core.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libsing-box.so | grep -E -i -q "aarch64"
          echo "ARM64 shared libraries verified successfully."

      - name: Verify 16KB ELF alignment and DT_NEEDED dependency resolution
        run: |
          echo "=== 1. Checking 16KB PT_LOAD segment alignment for libaether_jni.so and libsing-box.so ==="
          readelf -l app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep LOAD
          if readelf -l app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep LOAD | grep -q "0x1000$"; then
            echo "ERROR: libaether_jni.so has 4KB (0x1000) PT_LOAD alignment instead of 16KB" >&2
            exit 1
          fi
          readelf -l app/src/main/jniLibs/arm64-v8a/libsing-box.so | grep LOAD
          if readelf -l app/src/main/jniLibs/arm64-v8a/libsing-box.so | grep LOAD | grep -q "0x1000$"; then
            echo "ERROR: libsing-box.so has 4KB (0x1000) PT_LOAD alignment instead of 16KB" >&2
            exit 1
          fi
          echo "16KB ELF segment alignment verified."

          echo "=== 2. Verifying DT_NEEDED dependencies for all packaged shared libraries ==="
          ALLOWED_SYSTEM_LIBS="libc.so libm.so libdl.so liblog.so libz.so libandroid.so libjnigraphics.so libEGL.so libGLESv2.so libOpenSLES.so libmediandk.so"
          BUNDLED_LIBS="libaether_jni.so libhev-socks5-tunnel.so libc++_shared.so libpsiphon-tunnel-core.so libsing-box.so"
          for so in app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "Checking dependencies of $(basename "$so")..."
            NEEDED=$(readelf -d "$so" 2>/dev/null | grep "(NEEDED)" | sed -E 's/.*\[(.*)\]/\1/' || true)
            for dep in $NEEDED; do
              echo "  -> depends on: $dep"
              if echo "$ALLOWED_SYSTEM_LIBS $BUNDLED_LIBS" | grep -w -q "$dep"; then
                echo "     [OK] resolved"
              else
                echo "     [ERROR] Unresolvable dynamic dependency: $dep" >&2
                exit 1
              fi
            done
          done
          echo "All DT_NEEDED dynamic dependencies successfully resolved."

          echo "=== 3. Verifying zero unresolved dynamic symbols in libaether_jni.so ==="
          # Check 1: No GLOBAL undefined cryptographic or engine symbols (dlopen fatal blockers)
          if readelf -Ws --dyn-syms app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep " GLOBAL " | grep " UND " | grep -E "(^|[ _])(SSL_|EVP_|CRYPTO_|BORINGSSL_|bssl_|quiche_|aether_)"; then
            echo "ERROR: Unresolved BoringSSL/Quiche/Aether symbols found in libaether_jni.so!" >&2
            exit 1
          fi

          # Check 2: Strict symbol audit for non-system undefined symbols
          python3 - <<'EOF'
          import subprocess
          import sys

          out = subprocess.check_output(['readelf', '-Ws', '--dyn-syms', 'app/src/main/jniLibs/arm64-v8a/libaether_jni.so']).decode('utf-8')
          
          # Allowed system prefixes for Android NDK public libraries (libc, libm, libdl, liblog) and libc++_shared
          allowed_prefix = (
              '__', '_exit', 'abort', 'bind', 'bsearch', 'calloc', 'chdir', 'chmod', 'chroot',
              'clock_gettime', 'close', 'closedir', 'connect', 'dirfd', 'dl_iterate_phdr',
              'dlclose', 'dlopen', 'dlsym', 'dup2', 'environ', 'epoll_', 'eventfd', 'execvp',
              'fclose', 'fcntl', 'feof', 'ferror', 'fflush', 'fgets', 'fopen', 'fork', 'fprintf',
              'fread', 'free', 'freeaddrinfo', 'fseek', 'fstat', 'fsync', 'ftell', 'fwrite',
              'gai_strerror', 'getaddrinfo', 'getauxval', 'getcwd', 'getenv', 'getpeername',
              'getpid', 'getrandom', 'getrlimit', 'getsockname', 'getsockopt', 'gettid',
              'gettimeofday', 'isatty', 'kill', 'listen', 'lseek64', 'lstat', 'madvise', 'malloc',
              'memchr', 'memcmp', 'memcpy', 'memmove', 'memset', 'mkdir', 'mmap', 'munmap',
              'open', 'opendir', 'perror', 'pipe2', 'poll', 'posix_memalign', 'pow', 'prctl',
              'pthread_', 'read', 'readdir', 'readlink', 'realloc', 'realpath', 'recv', 'recvfrom',
              'rename', 'sched_', 'send', 'sendto', 'setgid', 'setgroups', 'setpgid', 'setrlimit',
              'setsid', 'setsockopt', 'setuid', 'shutdown', 'sigaction', 'socket', 'socketpair',
              'stat', 'strchr', 'strcmp', 'strerror', 'strlen', 'strncmp', 'syscall', 'sysconf',
              'time', 'unlink', 'vsnprintf', 'waitpid', 'write', 'writev',
              '_Z', 'ZSTD_trace_', 'OPENSSL_memory_'
          )

          unresolved = []
          for line in out.splitlines():
              parts = line.split()
              if len(parts) >= 8 and parts[6] == 'UND' and parts[4] == 'GLOBAL':
                  sym_name = parts[7]
                  if not any(sym_name.startswith(p) for p in allowed_prefix):
                      unresolved.append(sym_name)

          if unresolved:
              print(f"ERROR: Found {len(unresolved)} unresolved dynamic symbols in libaether_jni.so:")
              for s in unresolved:
                  print(f"  - {s}")
              sys.exit(1)

          print("SUCCESS: 0 unresolved non-system dynamic symbols in libaether_jni.so.")
          EOF

          echo "=== 4. Verifying libpsiphon-tunnel-core.so ELF properties & patched protocols ==="
          readelf -h app/src/main/jniLibs/arm64-v8a/libpsiphon-tunnel-core.so | grep -q "ELF64"
          readelf -h app/src/main/jniLibs/arm64-v8a/libpsiphon-tunnel-core.so | grep -E -q "AArch64|183"
          grep -a -q "FRONTED-MEEK-CDN-OSSH" app/src/main/jniLibs/arm64-v8a/libpsiphon-tunnel-core.so
          echo "libpsiphon-tunnel-core.so ELF properties (ELFCLASS64, EM_AARCH64) & FRONTED-MEEK-CDN-OSSH verified."

      - name: Assemble ARM64 Debug APK (bounded workers)
        run: gradle --max-workers=2 :app:assembleDebug

      - name: Verify APK structure and native libraries
        run: |
          APK=$(ls app/build/outputs/apk/debug/aether-android-arm64-v*.apk | head -n 1)
          test -s "$APK"
          echo "Verifying APK: $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libaether_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libhev-socks5-tunnel.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libc++_shared.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libpsiphon-tunnel-core.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libsing-box.so"
          if unzip -l "$APK" | grep -E "lib/(armeabi|x86|x86_64)/"; then
            echo "ERROR: Unwanted ABIs packaged into APK"
            exit 1
          fi

          python3 - "$APK" <<'EOF'
          import zipfile
          import sys

          apk_path = sys.argv[1]
          with zipfile.ZipFile(apk_path) as z:
              info = z.getinfo('lib/arm64-v8a/libpsiphon-tunnel-core.so')
              if info.file_size == 0:
                  print("ERROR: libpsiphon-tunnel-core.so inside APK is empty!")
                  sys.exit(1)
              raw = z.read('lib/arm64-v8a/libpsiphon-tunnel-core.so')
              hdr = raw[:64]
              magic = hdr[:4]
              elf_class = hdr[4] # 2 = ELFCLASS64
              machine = int.from_bytes(hdr[18:20], 'little') # 0xb7 = 183 = EM_AARCH64
              if magic != b'\x7fELF' or elf_class != 2 or machine != 0xb7:
                  print(f"ERROR: libpsiphon-tunnel-core.so invalid ELF header: magic={magic}, class={elf_class}, machine={hex(machine)}")
                  sys.exit(1)
              if b'FRONTED-MEEK-CDN-OSSH' not in raw:
                  print("ERROR: libpsiphon-tunnel-core.so inside APK missing FRONTED-MEEK-CDN-OSSH string!")
                  sys.exit(1)
              print(f"SUCCESS: libpsiphon-tunnel-core.so inside APK verified (size={info.file_size} bytes, ELFCLASS64, EM_AARCH64, FRONTED-MEEK-CDN-OSSH).")

              sb_info = z.getinfo('lib/arm64-v8a/libsing-box.so')
              if sb_info.file_size == 0:
                  print("ERROR: libsing-box.so inside APK is empty!")
                  sys.exit(1)
              sb_raw = z.read('lib/arm64-v8a/libsing-box.so')
              sb_hdr = sb_raw[:64]
              if sb_hdr[:4] != b'\x7fELF' or sb_hdr[4] != 2 or int.from_bytes(sb_hdr[18:20], 'little') != 0xb7:
                  print("ERROR: libsing-box.so invalid ELF header")
                  sys.exit(1)
              print(f"SUCCESS: libsing-box.so inside APK verified (size={sb_info.file_size} bytes, ELFCLASS64, EM_AARCH64).")
          EOF

          echo "APK ARM64-v8a packaging verified successfully."

      - name: Stage APK and generate SHA-256 checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/aether-android-arm64-v${DEBUG_VERSION}.apk release-artifacts/
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          echo "Generated SHA-256 Checksums:"
          cat SHA256SUMS.txt

      - name: Upload workflow APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-arm64-v${{ env.DEBUG_VERSION }}
          path: release-artifacts/*

      - name: Restore rolling APK history cache (last 10 builds)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: .apk-history
          key: apk-history-b${{ github.run_number }}
          restore-keys: |
            apk-history-

      - name: Publish rolling debug-latest pre-release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-latest"
          TITLE="v${DEBUG_VERSION}"
          CURR_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          APK_NAME="aether-android-arm64-v${DEBUG_VERSION}.apk"
          APK_PATH="release-artifacts/${APK_NAME}"
          SUMS_PATH="release-artifacts/SHA256SUMS.txt"
          MANIFEST_PATH="release-artifacts/delta-manifest.json"
          NOTES="Rolling automated ARM64 Debug build from \`main\` (${GITHUB_SHA::7})."$'\n\n'"**Version:** \`${TITLE}\`"

          mkdir -p .apk-history
          RELEASE_EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          # Seed .apk-history on first run if empty and a previous debug-latest APK exists
          if [ "$RELEASE_EXISTS" = true ] && ! ls .apk-history/b*.apk >/dev/null 2>&1; then
            PREV_APK_NAME=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".apk")) | .name' | head -n 1 || true)
            PREV_VERSION_CODE=$(echo "$PREV_APK_NAME" | sed -nE 's/.*-b([0-9]+).*\.apk$/\1/p')
            if [ -n "$PREV_APK_NAME" ] && [ -n "$PREV_VERSION_CODE" ] && [ "$PREV_VERSION_CODE" != "$CURR_VERSION_CODE" ]; then
              echo "Seeding .apk-history with previous release APK: $PREV_APK_NAME (b$PREV_VERSION_CODE)"
              gh release download "$TAG" -p "$PREV_APK_NAME" -O ".apk-history/b${PREV_VERSION_CODE}.apk" || rm -f ".apk-history/b${PREV_VERSION_CODE}.apk"
            fi
          fi

          FULL_SIZE=$(stat -c%s "$APK_PATH")
          TARGET_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          THRESHOLD=$((FULL_SIZE * 65 / 100))
          PATCH_FILES=()
          PATCH_RECORDS_FILE=$(mktemp)

          if ls .apk-history/b*.apk >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y bsdiff
            # Sort cached APKs newest-first and generate deltas for up to 10 prior builds
            COUNT=0
            for PREV_APK in $(ls -1 .apk-history/b*.apk | sort -t'b' -k2 -nr); do
              PREV_VC=$(basename "$PREV_APK" .apk | sed 's/^b//')
              if [ -z "$PREV_VC" ] || [ "$PREV_VC" = "$CURR_VERSION_CODE" ]; then
                continue
              fi
              if [ "$COUNT" -ge 10 ]; then
                break
              fi
              COUNT=$((COUNT + 1))
              PATCH_NAME="delta-b${PREV_VC}-to-b${CURR_VERSION_CODE}.patch"
              CANDIDATE_PATCH="release-artifacts/${PATCH_NAME}"
              echo "Generating bsdiff patch: b${PREV_VC} -> b${CURR_VERSION_CODE}..."
              bsdiff "$PREV_APK" "$APK_PATH" "$CANDIDATE_PATCH"
              PATCH_SIZE=$(stat -c%s "$CANDIDATE_PATCH")
              echo "  Patch ${PATCH_NAME}: ${PATCH_SIZE} bytes (full: ${FULL_SIZE} bytes, 65% threshold: ${THRESHOLD} bytes)"
              if [ "$PATCH_SIZE" -lt "$THRESHOLD" ]; then
                PATCH_SHA256=$(sha256sum "$CANDIDATE_PATCH" | awk '{print $1}')
                echo "${PREV_VC}|${PATCH_NAME}|${PATCH_SIZE}|${PATCH_SHA256}" >> "$PATCH_RECORDS_FILE"
                PATCH_FILES+=("$CANDIDATE_PATCH")
              else
                echo "  Skipping ${PATCH_NAME} (>= 65% of full APK)"
                rm -f "$CANDIDATE_PATCH"
              fi
            done
          fi

          python3 - "$CURR_VERSION_CODE" "$DEBUG_VERSION" "$APK_NAME" "$FULL_SIZE" "$TARGET_SHA256" "$PATCH_RECORDS_FILE" "$MANIFEST_PATH" <<'EOF'
          import json
          import sys

          to_vc = int(sys.argv[1])
          to_ver = sys.argv[2]
          full_name = sys.argv[3]
          full_size = int(sys.argv[4])
          target_sha = sys.argv[5]
          records_path = sys.argv[6]
          manifest_path = sys.argv[7]

          patches = []
          with open(records_path, "r", encoding="utf-8") as rf:
              for line in rf:
                  line = line.strip()
                  if not line:
                      continue
                  from_vc, patch_name, patch_size, patch_sha = line.split("|")
                  patches.append({
                      "fromVersionCode": int(from_vc),
                      "patchAssetName": patch_name,
                      "patchSize": int(patch_size),
                      "patchSha256": patch_sha,
                  })

          manifest = {
              "toVersionCode": to_vc,
              "toVersionName": to_ver,
              "fullAssetName": full_name,
              "fullSize": full_size,
              "targetApkSha256": target_sha,
              "patches": patches,
          }
          with open(manifest_path, "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2)
              mf.write("\n")
          EOF
          rm -f "$PATCH_RECORDS_FILE"
          echo "Generated delta-manifest.json:"
          cat "$MANIFEST_PATH"

          # Store current APK in .apk-history and prune to last 10 builds
          cp "$APK_PATH" ".apk-history/b${CURR_VERSION_CODE}.apk"
          KEEP=0
          for HIST_APK in $(ls -1 .apk-history/b*.apk | sort -t'b' -k2 -nr); do
            KEEP=$((KEEP + 1))
            if [ "$KEEP" -gt 10 ]; then
              echo "Pruning old cached APK: $HIST_APK"
              rm -f "$HIST_APK"
            fi
          done

          UPLOAD_FILES=("$APK_PATH" "$SUMS_PATH" "$MANIFEST_PATH")
          if [ "${#PATCH_FILES[@]}" -gt 0 ]; then
            UPLOAD_FILES+=("${PATCH_FILES[@]}")
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            EXISTING_ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in $EXISTING_ASSETS; do
              echo "Deleting stale asset: $asset"
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
            gh release upload "$TAG" "${UPLOAD_FILES[@]}" --clobber
          else
            gh release create "$TAG" "${UPLOAD_FILES[@]}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi
