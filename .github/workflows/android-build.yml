name: Build Aether Android VPN (ARM64)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build & Verify ARM64 APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_COMPILE_SDK: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "26.3.11579264"
      GRADLE_VERSION: "8.9"
      HEV_VERSION: "2.20.0"
      BUILD_JOBS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & pinned NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Generate Cargo lockfile for JNI crate
        run: cargo generate-lockfile --manifest-path native/aether-jni/Cargo.toml

      - name: Cache Rust & Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native/aether-jni -> target"

      - name: Cache pinned hev-socks5-tunnel source
        uses: actions/cache@v4
        with:
          path: native/hev-socks5-tunnel
          key: hev-socks5-tunnel-${{ env.HEV_VERSION }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build ARM64 native libraries (Aether + pinned HEV 2.20.0)
        env:
          ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
        run: bash scripts/build-natives.sh

      - name: Verify ARM64 shared libraries exist and are ELF aarch64
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libaether_jni.so
          test -s app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          test -s app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          file app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so | grep -E -i -q "aarch64"
          file app/src/main/jniLibs/arm64-v8a/libc++_shared.so | grep -E -i -q "aarch64"
          echo "ARM64 shared libraries verified successfully."

      - name: Verify 16KB ELF alignment and DT_NEEDED dependency resolution
        run: |
          echo "=== 1. Checking 16KB PT_LOAD segment alignment for libaether_jni.so ==="
          readelf -l app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep LOAD
          if readelf -l app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep LOAD | grep -q "0x1000$"; then
            echo "ERROR: libaether_jni.so has 4KB (0x1000) PT_LOAD alignment instead of 16KB" >&2
            exit 1
          fi
          echo "16KB ELF segment alignment verified."

          echo "=== 2. Verifying DT_NEEDED dependencies for all packaged shared libraries ==="
          ALLOWED_SYSTEM_LIBS="libc.so libm.so libdl.so liblog.so libz.so libandroid.so libjnigraphics.so libEGL.so libGLESv2.so libOpenSLES.so libmediandk.so"
          BUNDLED_LIBS="libaether_jni.so libhev-socks5-tunnel.so libc++_shared.so"
          for so in app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "Checking dependencies of $(basename "$so")..."
            NEEDED=$(readelf -d "$so" | grep "(NEEDED)" | sed -E 's/.*\[(.*)\]/\1/')
            for dep in $NEEDED; do
              echo "  -> depends on: $dep"
              if echo "$ALLOWED_SYSTEM_LIBS $BUNDLED_LIBS" | grep -w -q "$dep"; then
                echo "     [OK] resolved"
              else
                echo "     [ERROR] Unresolvable dynamic dependency: $dep" >&2
                exit 1
              fi
            done
          done
          echo "All DT_NEEDED dynamic dependencies successfully resolved."

          echo "=== 3. Verifying zero unresolved dynamic symbols in libaether_jni.so ==="
          # Check 1: Cryptographic and engine symbol check
          if readelf -Ws --dyn-syms app/src/main/jniLibs/arm64-v8a/libaether_jni.so | grep " UND " | grep -E "SSL_|EVP_|CRYPTO_|BORINGSSL_|bssl_|quiche_|aether_"; then
            echo "ERROR: Unresolved BoringSSL/Quiche/Aether symbols found in libaether_jni.so!" >&2
            exit 1
          fi

          # Check 2: Strict symbol audit for non-system undefined symbols
          python3 - <<'EOF'
          import subprocess
          import sys

          out = subprocess.check_output(['readelf', '-Ws', '--dyn-syms', 'app/src/main/jniLibs/arm64-v8a/libaether_jni.so']).decode('utf-8')
          
          # Allowed system prefixes for Android NDK public libraries (libc, libm, libdl, liblog) and libc++_shared
          allowed_prefix = (
              '__', '_exit', 'abort', 'bind', 'bsearch', 'calloc', 'chdir', 'chmod', 'chroot',
              'clock_gettime', 'close', 'closedir', 'connect', 'dirfd', 'dl_iterate_phdr',
              'dlclose', 'dlopen', 'dlsym', 'dup2', 'environ', 'epoll_', 'eventfd', 'execvp',
              'fclose', 'fcntl', 'feof', 'ferror', 'fflush', 'fgets', 'fopen', 'fork', 'fprintf',
              'fread', 'free', 'freeaddrinfo', 'fseek', 'fstat', 'fsync', 'ftell', 'fwrite',
              'gai_strerror', 'getaddrinfo', 'getauxval', 'getcwd', 'getenv', 'getpeername',
              'getpid', 'getrandom', 'getrlimit', 'getsockname', 'getsockopt', 'gettid',
              'gettimeofday', 'isatty', 'kill', 'listen', 'lseek64', 'lstat', 'madvise', 'malloc',
              'memchr', 'memcmp', 'memcpy', 'memmove', 'memset', 'mkdir', 'mmap', 'munmap',
              'open', 'opendir', 'perror', 'pipe2', 'poll', 'posix_memalign', 'pow', 'prctl',
              'pthread_', 'read', 'readdir', 'readlink', 'realloc', 'realpath', 'recv', 'recvfrom',
              'rename', 'sched_', 'send', 'sendto', 'setgid', 'setgroups', 'setpgid', 'setrlimit',
              'setsid', 'setsockopt', 'setuid', 'shutdown', 'sigaction', 'socket', 'socketpair',
              'stat', 'strchr', 'strcmp', 'strerror', 'strlen', 'strncmp', 'syscall', 'sysconf',
              'time', 'unlink', 'vsnprintf', 'waitpid', 'write', 'writev',
              '_Z', 'ZSTD_trace_', 'OPENSSL_memory_'
          )

          unresolved = []
          for line in out.splitlines():
              parts = line.split()
              if len(parts) >= 8 and parts[6] == 'UND' and parts[4] == 'GLOBAL':
                  sym_name = parts[7]
                  if not any(sym_name.startswith(p) for p in allowed_prefix):
                      unresolved.append(sym_name)

          if unresolved:
              print(f"ERROR: Found {len(unresolved)} unresolved dynamic symbols in libaether_jni.so:")
              for s in unresolved:
                  print(f"  - {s}")
              sys.exit(1)

          print("SUCCESS: 0 unresolved non-system dynamic symbols in libaether_jni.so.")
          EOF

      - name: Set up pinned Gradle 8.9 with build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Run unit tests & assemble ARM64 Debug APK (bounded workers)
        run: gradle --max-workers=2 :app:testDebugUnitTest :app:assembleDebug

      - name: Assemble signed Release APK (only when keystore secrets are present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            cat > keystore.properties <<EOF
          storeFile=../release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
            gradle --max-workers=2 :app:assembleRelease
            rm -f release.jks keystore.properties
          else
            echo "No signing keystore configured; skipping release APK assembly."
          fi

      - name: Verify APK structure and native libraries
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libaether_jni.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libhev-socks5-tunnel.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libc++_shared.so"
          if unzip -l "$APK" | grep -E "lib/(armeabi|x86|x86_64)/"; then
            echo "ERROR: Unwanted ABIs packaged into APK"
            exit 1
          fi
          echo "APK ARM64-v8a packaging verified successfully."

      - name: Stage APK and generate SHA-256 checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/aether-android-arm64-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/aether-android-arm64-release.apk
          fi
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          echo "Generated SHA-256 Checksums:"
          cat SHA256SUMS.txt

      - name: Upload workflow APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-android-vpn-arm64
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: build-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: aether-android-vpn-arm64
          path: release-artifacts

      - name: Publish Verified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
